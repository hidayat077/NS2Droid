name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Games to build into the APK (comma-separated Title IDs, or "all")'
        required: false
        default: 'all'
      build_variant:
        description: 'Build variant: release (apk task), play (-PnxPlay=true), or debug'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - play
          - debug
  push:
    branches:
      - main
      - android
      - 'integrate-*'
      - 'android-*'
      - 'custom-*'
      - 'feat/*'
    paths:
      - 'android/**'
      - 'dm/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zsh

      - name: Install Android NDK and CMake
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          mkdir -p android/app
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" "$ANDROID_HOME" > android/app/local.properties

      - name: Build on-device packer stage
        run: zsh android/ondevice/build.sh "$RUNNER_TEMP/nx-pack" all

      - name: Build APK
        working-directory: android/app
        run: |
          GAMES="${{ github.event.inputs.games || 'all' }}"
          VARIANT="${{ github.event.inputs.build_variant || 'release' }}"
          echo "Building for games: $GAMES (variant: $VARIANT)"
          if [ "$VARIANT" = "play" ]; then
            ./gradlew --no-daemon -PnxPackStage="$RUNNER_TEMP/nx-pack/stage" -PnxGames="$GAMES" -PnxPlay=true apk
          elif [ "$VARIANT" = "debug" ]; then
            ./gradlew --no-daemon -PnxPackStage="$RUNNER_TEMP/nx-pack/stage" -PnxGames="$GAMES" assembleDebug
          else
            ./gradlew --no-daemon -PnxPackStage="$RUNNER_TEMP/nx-pack/stage" -PnxGames="$GAMES" apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NS2Droid-Android-APK
          path: |
            android/app/out/*.apk
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
